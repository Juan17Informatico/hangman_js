name: Release PR Validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-release-pr:
    name: Validate release PR checklist
    if: startsWith(github.head_ref, 'release_')
    runs-on: ubuntu-latest

    steps:
      - name: Validate required release checklist items
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';

            const requiredCheckedItems = [
              'QA aprobado',
              'Rollback definido',
              'Smoke test OK',
            ];

            const missing = requiredCheckedItems.filter((item) => {
              const pattern = new RegExp(`- \\[[xX]\\]\\s*${item.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\$&')}`, 'u');
              return !pattern.test(body);
            });

            if (missing.length > 0) {
              core.setFailed([
                'Release PR incompleto. Marca los items requeridos en el body del PR:',
                ...missing.map((item) => `- ${item}`),
              ].join('\n'));
            }

  skip-non-release-pr:
    name: Skip non-release PR
    if: ${{ !startsWith(github.head_ref, 'release_') }}
    runs-on: ubuntu-latest

    steps:
      - name: No release validation required
        run: echo "PR hacia main desde rama no release_; no aplica validacion de release."
